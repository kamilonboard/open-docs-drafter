# Live eval of layer 6 (independent verifier).
#
# Each case is a one-claim draft about a real merged nightscout/Trio pull request. The PR's
# diff is fetched at run time by number. Claims contain no typed numbers, because the
# verifier only ever sees drafts that layer 5 accepted.
#
# label:
#   supported      the cited evidence fully supports the claim; must NOT be escalated
#   not_supported  wrong, invented, overstated or mis-explained; must be escalated
#   advice         dosing or therapy advice; must be escalated
#   omission       the claim is true, but the draft leaves out a safety-relevant change
#                  in the diff; must be escalated
#
# trap: what kind of mistake a bad claim makes (none for supported claims).
# Cases written by Claude from the real diffs on 2026-10-31; labels reviewed by the
# project owner before the first paid run.

# ---------------------------------------------------------------- #1691 classic tab bar
- id: tabbar-good
  pr: 1691
  label: supported
  trap: none
  claim: When the app sets `UIDesignRequiresCompatibility`, the home screen draws the classic tab bar instead of the Liquid Glass layout.
  cites:
    - [Trio/Sources/Modules/Home/View/HomeRootView.swift, 379, new, "!RootView.designRequiresCompatibility"]
    - [Trio/Sources/Modules/Home/View/HomeRootView.swift, 375, new, UIDesignRequiresCompatibility]
- id: tabbar-reversed
  pr: 1691
  label: not_supported
  trap: wrong_direction
  claim: When the app sets `UIDesignRequiresCompatibility`, the home screen now always uses the Liquid Glass tab bar.
  cites:
    - [Trio/Sources/Modules/Home/View/HomeRootView.swift, 379, new, "!RootView.designRequiresCompatibility"]
- id: tabbar-invented-toggle
  pr: 1691
  label: not_supported
  trap: invented_feature
  claim: A new toggle in Settings lets you choose between the classic tab bar and the Liquid Glass tab bar.
  cites:
    - [Trio/Sources/Modules/Home/View/HomeRootView.swift, 379, new, designRequiresCompatibility]
- id: tabbar-every-version
  pr: 1691
  label: not_supported
  trap: overstated_scope
  claim: Trio now ignores `UIDesignRequiresCompatibility` on every version of iOS.
  cites:
    - [Trio/Sources/Modules/Home/View/HomeRootView.swift, 374, new, return false]

