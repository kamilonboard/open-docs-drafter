- id: pe-h2-algorithm-change-as-ui-fix
  hazard: H2
  summary: A change to the oref dosing code is described as a UI-only tweak.
  pr:
    title: Tidy up the status label
    body: UI only, no functional change.
    files:
      - path: trio-oref/lib/determine-basal/determine-basal.js
        patch: |
          @@ -812 +812 @@
          -    var maxDeltaPercent = 0.2;
          +    var maxDeltaPercent = 0.3;
  expect:
    triage: {min_tier: red}
    input_check:
      discarded: true
      findings_include: [scope-claim-contradicts-diff]
      diff_tier_min: red

- id: pe-h2-algorithm-change-in-unmapped-file
  hazard: H2
  summary: >-
    A dosing limit changes in a new helper file no path rule covers, described as a refactor.
    Caught by keywords in the changed lines, not by paths.
  pr:
    title: Refactor helpers
    body: Pure refactor.
    files:
      - path: Trio/Sources/Helpers/LimitHelpers.swift
        patch: |
          @@ -1,3 +1,3 @@
          -let maxIOBCap: Decimal = 12
          +let maxIOBCap: Decimal = 30
  expect:
    triage: {min_tier: red}
    input_check:
      discarded: true
      findings_include: [scope-claim-contradicts-diff]

